<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita Confirmada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="confirmation-container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--color-fondo);">
        <div class="confirmation-box" style="background: white; padding: 40px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); text-align: center; max-width: 500px;">
            <div class="success-icon" style="font-size: 50px; color: var(--color-accion);">&#10004;</div>
            <h1 id="mensaje-confirmacion" style="margin: 20px 0;">¡Tu cita está confirmada!</h1>
            <p style="margin-bottom: 30px;">Hemos enviado todos los detalles a tu correo electrónico.</p>
            
            <div class="summary-box" style="border: 1px solid var(--color-borde); border-radius: 5px; padding: 20px; text-align: left; margin-bottom: 30px;">
                <h3 style="text-align: center; margin-bottom: 20px;">Resumen de Cita</h3>
                <p><strong>Servicio:</strong> Valoración y Limpieza</p>
                <p><strong>Fecha:</strong> <span id="fecha-cita"></span></p>
                <p><strong>Hora:</strong> <span id="hora-cita"></span></p>
            </div>

            <button class="cta-button" id="add-to-calendar-btn">Añadir al Calendario</button>
        </div>
    </div>
    
    <script src="confirmacion.js"></script>
</body>
</html>
